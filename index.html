<!DOCTYPE html>
<html lang="sv" class="h-full bg-[#0b0f19]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logga in</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center font-sans antialiased text-slate-200 px-4">

    <div class="w-full max-w-md bg-[#131a26] border border-slate-800 rounded-2xl p-8 shadow-xl">
        
        <!-- Header -->
        <div class="mb-8 text-center">
            <h1 class="text-2xl font-semibold tracking-tight text-white">Välkommen tillbaka</h1>
            <p class="text-sm text-slate-400 mt-2">Logga in på ditt konto för att fortsätta</p>
        </div>

        <!-- Form -->
        <form action="#" method="POST" class="space-y-6" onsubmit="event.preventDefault(); alert('Hypotetisk inloggning skickad!');">
            
            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-2">E-postadress</label>
                <input type="email" id="email" name="email" required autocomplete="email"
                    placeholder="namn@företag.se"
                    class="w-full bg-[#1e293b] border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200 text-sm">
            </div>

            <!-- Password -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label for="password" class="block text-sm font-medium text-slate-300">Lösenord</label>
                    <a href="#" class="text-xs font-medium text-indigo-400 hover:text-indigo-300 transition">Glömt lösenordet?</a>
                </div>
                <input type="password" id="password" name="password" required autocomplete="current-password"
                    placeholder="••••••••"
                    class="w-full bg-[#1e293b] border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200 text-sm">
            </div>

            <!-- Remember Me -->
            <div class="flex items-center">
                <input type="checkbox" id="remember-me" name="remember-me"
                    class="h-4 w-4 rounded bg-[#1e293b] border-slate-700 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-[#131a26]">
                <label for="remember-me" class="ml-2 block text-sm text-slate-400 select-none">Kom ihåg mig</label>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl py-3 text-sm shadow-lg shadow-indigo-600/20 transition duration-200 active:scale-[0.98]">
                Logga in
            </button>
        </form>

        <!-- Footer -->
        <p class="mt-8 text-center text-sm text-slate-400">
            Har du inget konto? 
            <a href="#" class="font-medium text-indigo-400 hover:text-indigo-300 transition">Skapa ett här</a>
        </p>

    </div>

</body>
</html>
