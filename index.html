<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Screen</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-xl border border-slate-800 p-8 sm:p-10 transition-all duration-300">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight text-white">Welcome Back</h1>
            <p class="text-sm text-slate-400 mt-1">Please enter your details to sign in</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-5">
            
            <!-- Email Input Group -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    required 
                    placeholder="you@example.com"
                    class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 text-sm transition-all"
                >
            </div>

            <!-- Password Input Group -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
                    <a href="#" class="text-xs font-medium text-indigo-400 hover:text-indigo-300 transition-colors">Forgot password?</a>
                </div>
                <input 
                    type="password" 
                    id="password" 
                    required 
                    placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 text-sm transition-all"
                >
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/20 hover:shadow-indigo-500/30 transition-all duration-200 text-sm"
            >
                Sign In
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-slate-400">
            Don't have an account? <a href="#" class="font-medium text-indigo-400 hover:text-indigo-300">Sign up</a>
        </div>

        <!-- Feedback Message Box -->
        <div id="messageBox" class="hidden mt-6 p-4 rounded-xl text-sm font-medium text-center transition-all"></div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const msgBox = document.getElementById('messageBox');

            // Simulate successful sign-in feedback with dark mode styling
            msgBox.className = "mt-6 p-4 rounded-xl text-sm font-medium text-center bg-emerald-950/80 text-emerald-300 border border-emerald-800/50";
            msgBox.textContent = `Success! Welcome back, ${email}.`;
            msgBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
