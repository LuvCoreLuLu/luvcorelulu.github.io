<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Screen</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-xl border border-slate-800 p-8 sm:p-10 transition-all duration-300">
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-tight text-white">Welcome Back</h1>
            <p class="text-sm text-slate-400 mt-1">Please enter your details to sign in</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-5">
            
            <!-- Username Input Group -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    required 
                    placeholder="Enter your username"
                    class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 text-sm transition-all"
                >
            </div>

            <!-- Password Input Group -->
            <div>
                <div class="flex items-center justify-between mb-2">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Password</label>
                    <a href="#" class="text-xs font-medium text-indigo-400 hover:text-indigo-300 transition-colors">Forgot password?</a>
                </div>
                <input 
                    type="password" 
                    id="password" 
                    required 
                    placeholder="••••••••"
                    class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-slate-100 placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 text-sm transition-all"
                >
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/20 hover:shadow-indigo-500/30 transition-all duration-200 text-sm"
            >
                Sign In
            </button>
        </form>

        <div class="mt-4">
            <button 
                type="button" 
                onclick="enterGuestMode()" 
                class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium rounded-xl border border-slate-700 transition-all duration-200 text-sm"
            >
                Enter as Guest
            </button>
        </div>

        <!-- Feedback Message Box -->
        <div id="messageBox" class="hidden mt-6 p-4 rounded-xl text-sm font-medium text-center transition-all"></div>
    </div>

    <script>
        // Helper function to hash passwords using SHA-256
        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Pre-computed SHA-256 hashes for user accounts
        // Username is the key, value is the hashed password.
        const users = {
            // Admin account: password is "01229477"
            "admin": "d262d05988e0b4974f1d46b7fc42247aa4548db2b5dbec26df9441113220059c",
            
            /* --- TEMPLATE ENTRIES FOR FRIENDS (Uncomment and replace hashes as needed) --- */
            // "friend1": "HASH_FOR_FRIEND_1_HERE",
            // "friend2": "HASH_FOR_FRIEND_2_HERE",
            // "friend3": "HASH_FOR_FRIEND_3_HERE",
            // "friend4": "HASH_FOR_FRIEND_4_HERE"
        };

        async function handleLogin(event) {
            event.preventDefault();
            const usernameInput = document.getElementById('username').value.trim().toLowerCase();
            const passwordInput = document.getElementById('password').value;
            const msgBox = document.getElementById('messageBox');

            // Hash the user's entered password to compare against stored hash
            const hashedInputPassword = await hashPassword(passwordInput);

            // Check if username exists and password hash matches
            if (users[usernameInput] && users[usernameInput] === hashedInputPassword) {
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('currentUser', usernameInput);

                msgBox.className = "mt-6 p-4 rounded-xl text-sm font-medium text-center bg-emerald-950/85 text-emerald-300 border border-emerald-800/50 shadow-lg";
                msgBox.textContent = `Success! Welcome back, ${usernameInput}. Redirecting...`;
                msgBox.classList.remove('hidden');

                setTimeout(() => {
                    // window.location.href = "dashboard.html"; // Replace with your main app page later
                }, 1200);
            } else {
                msgBox.className = "mt-6 p-4 rounded-xl text-sm font-medium text-center bg-rose-950/85 text-rose-300 border border-rose-800/50 shadow-lg";
                msgBox.textContent = "Invalid username or password. Please try again.";
                msgBox.classList.remove('hidden');
            }
        }

        function enterGuestMode() {
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('currentUser', 'Guest');
            
            const msgBox = document.getElementById('messageBox');
            msgBox.className = "mt-6 p-4 rounded-xl text-sm font-medium text-center bg-amber-950/85 text-amber-300 border border-amber-800/50 shadow-lg";
            msgBox.textContent = "Entering as Guest...";
            msgBox.classList.remove('hidden');

            setTimeout(() => {
                // window.location.href = "dashboard.html"; // Replace with your main app page later
            }, 1000);
        }
    </script>
</body>
</html>
